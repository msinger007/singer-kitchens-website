<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Let's Talk About YOUR Kitchen — Singer Kitchens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&amp;family=Source+Sans+3:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --red: #C8281A;
  --red-light: #FAEBE9;
  --red-dark: #9E1E10;
  --border: rgba(0,0,0,0.13);
  --border-strong: rgba(0,0,0,0.22);
  --text: #1a1a1a;
  --muted: #555;
  --bg: #ffffff;
  --bg2: #f7f7f7;
  --display: Arial, Helvetica, sans-serif;
  --body: Arial, Helvetica, sans-serif;
}

html, body {
  font-family: var(--body);
  background: transparent;
  color: var(--text);
}

.sk {
  background: #fff;
  border-radius: 12px;
  box-shadow: 0 2px 24px rgba(0,0,0,0.08);
  max-width: 720px;
  margin: 0 auto;
}

.hdr {
  background: var(--red);
  padding: 24px 32px 20px;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  border-radius: 12px 12px 0 0;
}
.hdr h1 {
  font-family: var(--display);
  font-size: 24px;
  font-weight: 600;
  color: #fff;
  line-height: 1.2;
  margin-bottom: 6px;
}
.hdr p {
  font-size: 15px;
  color: rgba(255,255,255,0.82);
  font-weight: 300;
  line-height: 1.5;
}
.hdr-right {
  font-size: 12px;
  color: rgba(255,255,255,0.6);
  text-align: right;
  line-height: 1.8;
  white-space: nowrap;
  flex-shrink: 0;
  padding-top: 2px;
}

.pbar { height: 4px; background: rgba(0,0,0,0.1); }
.pfill {
  height: 100%;
  background: var(--red);
  transition: width 0.5s cubic-bezier(0.4,0,0.2,1);
}

.slbl {
  padding: 13px 32px 11px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border);
}
.sname {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--red);
}
.snum {
  font-size: 12px;
  color: var(--muted);
}

.sbody {
  padding: 28px 32px 8px;
  background: #fff;
}
.stitle {
  font-family: var(--display);
  font-size: 22px;
  font-weight: 600;
  color: var(--text);
  line-height: 1.3;
  margin-bottom: 8px;
}
.ssub {
  font-size: 15px;
  color: var(--muted);
  line-height: 1.6;
  margin-bottom: 28px;
}

.q { margin-bottom: 24px; }
.q label {
  display: block;
  font-size: 16px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 12px;
  line-height: 1.4;
}
.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}
.chip {
  padding: 11px 18px;
  border-radius: 8px;
  border: 2px solid var(--border-strong);
  background: #fff;
  font-family: var(--body);
  font-size: 15px;
  font-weight: 400;
  color: var(--text);
  cursor: pointer;
  transition: border-color 0.15s, color 0.15s, background 0.15s, transform 0.1s;
  line-height: 1.3;
  text-align: left;
}
.chip:hover {
  border-color: var(--red);
  color: var(--red);
}
.chip.on {
  background: var(--red);
  border-color: var(--red);
  color: #fff;
  font-weight: 500;
}

.dnote {
  margin: 4px 0 16px;
  padding: 16px 18px;
  background: var(--red-light);
  border-left: 4px solid var(--red);
  border-radius: 0 8px 8px 0;
  animation: fadeUp 0.3s ease forwards;
}
.dnote-lbl {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--red);
  margin-bottom: 6px;
}
.dnote p {
  font-size: 15px;
  color: var(--text);
  line-height: 1.7;
  font-style: italic;
}

.sfoot {
  padding: 18px 32px 24px;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 12px;
  border-top: 1px solid var(--border);
  background: #fff;
  position: sticky;
  bottom: 0;
  z-index: 10;
}
.btn-back {
  padding: 12px 22px;
  border-radius: 8px;
  border: 2px solid var(--border-strong);
  background: transparent;
  font-family: var(--body);
  font-size: 15px;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.15s;
}
.btn-back:hover { border-color: var(--text); color: var(--text); }
.btn-next {
  padding: 14px 32px;
  border-radius: 8px;
  border: none;
  background: var(--red);
  font-family: var(--body);
  font-size: 16px;
  font-weight: 600;
  color: #fff;
  cursor: pointer;
  transition: background 0.15s;
  flex-shrink: 0;
}
.btn-next:hover { background: var(--red-dark); }

.sum-wrap { padding: 28px 32px 36px; background: #fff; }
.sum-title {
  font-family: var(--display);
  font-size: 24px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 8px;
  line-height: 1.3;
}
.sum-intro {
  font-size: 15px;
  color: var(--muted);
  margin-bottom: 28px;
  line-height: 1.7;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--border);
}
.sum-section { margin-bottom: 24px; }
.sum-shdr {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--red);
  padding-bottom: 8px;
  margin-bottom: 12px;
  border-bottom: 1px solid var(--border);
}
.sum-block {
  background: var(--bg2);
  border-radius: 8px;
  padding: 16px 18px;
  margin-bottom: 10px;
}
.sum-block h4 {
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 7px;
}
.sum-block p {
  font-size: 15px;
  color: var(--text);
  line-height: 1.75;
}
.insight {
  padding: 16px 18px;
  background: var(--red-light);
  border-left: 4px solid var(--red);
  border-radius: 0 8px 8px 0;
  margin-bottom: 10px;
}
.insight .lbl {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--red);
  margin-bottom: 6px;
}
.insight p {
  font-size: 15px;
  color: var(--text);
  line-height: 1.75;
  font-style: italic;
}

.cta-box {
  background: var(--red);
  border-radius: 10px;
  padding: 26px 24px 22px;
  margin-top: 24px;
  text-align: center;
}
.cta-box p {
  font-size: 16px;
  color: rgba(255,255,255,0.9);
  margin-bottom: 20px;
  line-height: 1.6;
}
.cta-box strong { color: #fff; }
.cta-btns {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}
.btn-schedule {
  display: inline-block;
  padding: 14px 32px;
  border-radius: 8px;
  background: #fff;
  color: var(--red);
  font-family: var(--body);
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  border: none;
  text-decoration: none;
  transition: opacity 0.15s;
  width: 100%;
  max-width: 340px;
}
.btn-schedule:hover { opacity: 0.9; }
.btn-dl,
.btn-text {
  display: inline-block;
  padding: 12px 24px;
  border-radius: 8px;
  background: transparent;
  color: #fff;
  font-family: var(--body);
  font-size: 15px;
  font-weight: 500;
  cursor: pointer;
  border: 2px solid rgba(255,255,255,0.45);
  transition: background 0.15s;
  width: 100%;
  max-width: 340px;
  text-decoration: none;
}
.btn-dl:hover,
.btn-text:hover { background: rgba(255,255,255,0.12); }
.cta-phone {
  font-size: 13px;
  color: rgba(255,255,255,0.55);
  display: block;
  margin-top: 14px;
}
.restart-row { text-align: center; padding: 16px 0 4px; }

.fade { animation: fadeUp 0.35s ease forwards; }
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}

@media (max-width: 600px) {
  .sk { border-radius: 0; box-shadow: none; }

  .hdr { padding: 20px 16px 16px; gap: 10px; }
  .hdr h1 { 
    font-size: 24px; 
    line-height: 1.2; 
    font-weight: 600;
  }
  .hdr p { 
    font-size: 16px; 
    line-height: 1.6; 
  }

  .hdr-right { display: none; }

  .slbl { padding: 12px 16px; }
  .sname {
  font-size: 16px;   /* bigger + more prominent */
  font-weight: 600;
  letter-spacing: 0.05em;
}

.snum {
  font-size: 13px;   /* keep step smaller for hierarchy */
}

  .sbody { padding: 22px 16px 10px; }

  .stitle { 
    font-size: 24px; 
    line-height: 1.3; 
    font-weight: 600;
  }

  .ssub { 
    font-size: 17px; 
    line-height: 1.7; 
    margin-bottom: 22px;
  }

  .q label {
    font-size: 19px;
    line-height: 1.5;
    margin-bottom: 12px;
    font-weight: 600;
  }

  .chip {
    font-size: 18px;
    line-height: 1.5;
    padding: 14px 16px;
    width: 100%;
    border-radius: 10px;
  }

  .chips { gap: 8px; }

  .dnote p {
    font-size: 17px;
    line-height: 1.75;
  }

  .btn-back { font-size: 16px; }
  .btn-next { font-size: 18px; }

  /* ===== SUMMARY PAGE (MOST IMPORTANT) ===== */

  .sum-title {
    font-size: 30px;
    line-height: 1.15;
    font-weight: 600;
  }

  .sum-intro {
    font-size: 18px;
    line-height: 1.8;
  }

  .sum-shdr {
    font-size: 15px;
    letter-spacing: 0.08em;
    font-weight: 600;
	line-height: 1.4;
  }

  .sum-block h4 {
    font-size: 18px;
    line-height: 1.4;
    font-weight: 600;
  }

  .sum-block p,
  .insight p {
    font-size: 18px;
    line-height: 1.8;
  }

  .insight .lbl {
    font-size: 12px;
    font-weight: 600;
  }

  .cta-box p {
    font-size: 17px;
    line-height: 1.7;
  }

  .btn-schedule,
  .btn-dl,
  .btn-text {
    font-size: 17px;
    padding: 14px 16px;
  }

  .cta-phone {
    font-size: 14px;
  }
}

@media (max-width: 380px) {
  .sum-title { font-size: 22px; }
  .sum-intro,
  .sum-block p,
  .insight p,
  .cta-box p { font-size: 13.5px; }
  .sum-block h4 { font-size: 13.5px; }
}
</style>
</head>
<body>
<div class="sk">
  <div class="hdr">
    <div>
      <h1>Let's Talk About YOUR Kitchen.</h1>
      <p>The planning checklist that helps you design a kitchen you'll love for years.</p>
    </div>
    <div class="hdr-right">Singer Kitchens<br>New Orleans<br>Since 1928</div>
  </div>
  <div class="pbar"><div class="pfill" id="pf" style="width:20%"></div></div>
  <div id="app"></div>
</div>

<script nowprocket>
var currentStep = 0;
var answers = {};

var steps = [
  {
    id: 'big', name: 'The big picture',
    title: "What isn't working in your kitchen today?",
    subtitle: "The clearest path to a great kitchen starts with an honest look at what's frustrating you right now.",
    questions: [
      { id: 'pains', label: 'What bothers you most? (Select all that apply)', type: 'multi',
        opts: ['Not enough storage','Poor layout','Outdated look','Not enough counter space','Kitchen feels cramped',"Doesn't match the rest of the home",'Hard to cook and entertain','Cabinets peeling or worn'] },
      { id: 'use', label: 'How is your kitchen primarily used?', type: 'single',
        opts: ['Serious cooking & hosting','Family meals & mornings','A little of everything',"Mostly looks as we don't cook much"] }
    ],
    getNote: function(a) {
      var p = a.pains || [], u = a.use || '';
      if (p.indexOf('Cabinets peeling or worn') > -1 && u === 'Serious cooking & hosting') return "Peeling cabinets in a hard-working kitchen is something we see all the time, and it’s usually a sign the finish simply wasn’t built to last. Factory-finished cabinetry is in a completely different class, designed to hold up to daily use with far greater durability over time.";
      if (p.indexOf('Cabinets peeling or worn') > -1) return "Peeling or previously painted cabinets are something we see often, especially in older homes. In most cases, replacing those cabinets with new, factory-finished cabinetry provides a much more durable, long-lasting solution. It also creates the opportunity to rethink the layout entirely, improving flow, storage and how the kitchen functions day to day.";
      if (u === 'Serious cooking & hosting') return "A kitchen built for serious cooking and real entertaining isn't about square footage. It's about how the space is planned. The flow, the prep zones, the storage placement. Our designers start every conversation with how you actually cook, not how the kitchen looks in a photo.";
      if (u === "Mostly looks as we don't cook much") return "You'd be surprised how often a kitchen designed around lifestyle ends up changing how a family uses their home entirely. When the space finally feels right, people move differently in it. That's not an accident, it's good planning.";
      if (p.length >= 3) return "When you're dealing with multiple frustrations at once — layout, storage, looks — it usually means the kitchen wasn't designed for how you actually live. That's the most common situation Singer's designers see, and it's also where the most dramatic transformations happen.";
      return "Understanding what isn't working gives us a clear starting point. Most homeowners find that once they name it honestly, the path forward becomes much clearer than they expected.";
    }
  },
  {
    id: 'look', name: 'The look & feel',
    title: 'What kind of kitchen do you want to walk into?',
    subtitle: "Style matters, but it should always connect to how you actually live in the space.",
    questions: [
      { id: 'style', label: 'What style feels most like you?', type: 'single',
        opts: ['Classic & timeless','Modern & clean','Warm & farmhouse','Bold & personal',"I'll know it when I see it"] },
      { id: 'feel', label: 'What feeling do you want when you walk in?', type: 'single',
        opts: ['Bright & open','Warm & cozy','Dramatic & elevated','Light & airy','Calm & neutral'] },
      { id: 'inspo', label: 'Have you collected inspiration photos or ideas?', type: 'single',
        opts: ['Yes!','Some ideas but nothing organized','Not yet, starting from scratch'] }
    ],
    getNote: function(a) {
      var i = a.inspo || '', st = a.style || '', f = a.feel || '';
      if (i === 'Yes!') return "Bring everything, it tells our designers far more about what they actually want than any checklist question can. We read those folders carefully.";
      if (st === "I'll know it when I see it" || i === 'Not yet, starting from scratch') return "You don't need to arrive with answers. That's exactly what our showroom is designed for. Most homeowners say they didn't know what they wanted until they were standing in front of it. Touch the materials. See how finishes look in real light. That's when it clicks.";
      if (st === 'Classic & timeless' && f === 'Warm & cozy') return "Classic and warm is one of the most enduring combinations we create. Our designers have the experience and knowledge to personalize your space.";
      if (st === 'Bold & personal') return "Bold and personal is a conversation we love having. The kitchens that get talked about and that homeowners are proudest of, are almost always the ones where someone said 'I want this to feel like us.'";
      return "Style decisions land better when they're connected to how you actually live in the space. Our designers won't steer you toward a trend, they'll help you find what feels genuinely right for your home and your life in it.";
    }
  },
  {
    id: 'practical', name: 'The practical details',
    title: 'The decisions that make a kitchen truly functional.',
    subtitle: "These are the questions our designers work through before a single design line is drawn.",
    questions: [
      { id: 'scope', label: 'How much change are you open to?', type: 'single',
        opts: ['Cabinets & countertops only','Full renovation, existing layout','Open to moving walls if it helps'] },
      { id: 'appliances', label: 'What are you planning with your appliances?', type: 'single',
        opts: ['Keeping everything','Replacing some','Replacing everything','Not sure yet'] },
      { id: 'wishlist', label: 'Anything on your wishlist? (Select all that apply)', type: 'multi',
        opts: ['Island or peninsula','Coffee station','Walk-in pantry','Open up a wall','Better storage throughout','More counter space','Improved lighting','Upgraded sink or fixtures'] }
    ],
    getNote: function(a) {
      var w = a.wishlist || [], sc = a.scope || '', ap = a.appliances || '';
      if (w.indexOf('Island or peninsula') > -1 && w.indexOf('Open up a wall') > -1) return "Opening up a wall or adding an island is one of the most impactful transformations that can be done in a kitchen remodel. One reshapes how your kitchen connects to the rest of the home, while the other creates a natural place for gathering, prep and everyday living.";
      if (w.indexOf('Island or peninsula') > -1) return "An island is one of our most requested design elements. The conversation always starts with space requirements: minimum 36\" walkway around all obstacles, 24\" per person for seating.";
      if (w.indexOf('Open up a wall') > -1) return "Opening up a wall can transform not just the kitchen but the entire character of a home's main living space. Our designers begin with in-home measurements to understand your space, then our installer takes a closer look to determine what’s truly possible by evaluating structural elements, electrical, plumbing and ductwork. You'll know exactly what you're working with before any commitment is made.";
      if (w.indexOf('Walk-in pantry') > -1) return "Existing walk-in pantries are often one of the least functional spaces in a home due to deep shelves that hide everything in the back. We regularly convert them into butler's pantries, sculleries or cabinet pantries with adjustable roll-out trays. The result is almost always more usable storage in the same footprint.";
      if ((ap === 'Replacing everything' || ap === 'Replacing some') && sc !== 'Cabinets & countertops only') return "One thing that surprises homeowners: older homes often don't have the electrical or plumbing infrastructure that today's high-end appliances require. Some of those appliances also need more physical space than people expect. Singer's designers factor appliance specs into the plan from day one.";
      return "The practical details are where a good plan becomes a great kitchen. This is where Singer's decades of experience pays off most through every layout challenge, every quirky floor plan, every low window. We've worked through all of it.";
    }
  },
  {
    id: 'invest', name: 'Planning your investment',
    title: 'A few important questions about the financial side.',
    subtitle: '"What\'s this going to cost?" is the question we hear most. Let\'s make sure you\'re thinking about it clearly.',
    questions: [
      { id: 'budget', label: 'How are you thinking about budget right now?', type: 'single',
        opts: ['Have a clear number in mind','Have a range but need guidance','Not sure — need help understanding costs','Financing would open this up for me'] },
      { id: 'hometype', label: 'Is this your forever home — or are you thinking about resale?', type: 'single',
        opts: ['Forever home','Thinking about selling in a few years','Want it personal AND to hold value','Not sure yet'] },
      { id: 'timeline', label: 'When are you hoping to get started?', type: 'single',
        opts: ['As soon as possible','In the next 3-6 months','Later this year','Just planning ahead'] }
    ],
    getNote: function(a) {
      var b = a.budget || '', t = a.timeline || '', h = a.hometype || '';
      if (b === 'Financing would open this up for me') return "Singer offers several 0% interest financing plans with different down payment requirements and payment terms. Financing makes it easy to move forward with your kitchen remodel now and pay for it over time.";
      if (b === 'Not sure — need help understanding costs') return "Singer separates every quote into sections including cabinets, countertops, cabinet installation and additional construction costs. That breakdown lets you see exactly where the investment is going and make clear decisions about what matters most. There are no surprises in a well planned renovation.";
      if (t === 'As soon as possible' && h === 'Forever home') return "Here's the realistic timeline: about 2-4 weeks from first conversation to decisions and ordering, 5-7 weeks for cabinets to arrive, then two to four weeks for most installations. Our crews are usually scheduled when materials are ordered so everything aligns.";
      if (h === 'Thinking about selling in a few years') return "A kitchen renovation for resale is a different conversation. The goal is maximum visible impact per dollar invested, focused on the updates that move buyers.";
      return "Understanding your investment goals helps us to guide you to make the best decisions. Whether this is your forever kitchen or a smart move before selling, Singer's designers will help you make the decision that fits your specific situation.";
    }
  },
  {
    id: 'vision', name: 'Your dream kitchen',
    title: 'When this renovation is finished, how do you want to feel?',
    subtitle: 'This is the question that matters most. Everything else leads here.',
    questions: [
      { id: 'outcome', label: 'What outcome matters most? (Select all that apply)', type: 'multi',
        opts: ['Cooking feels easier and more enjoyable','Finally organized & everything has a place','Space for family to gather naturally','Proud to have people over with no more embarrassment','Kitchen finally matches the style of my home','Confident I made a smart long-term investment','I want to love walking into my kitchen every morning'] },
      { id: 'concern', label: "What's your biggest concern going into this?", type: 'single',
        opts: ['Making the wrong design choices','Going over budget','Living through the disruption','Finding a company I can truly trust','Not knowing what I don\'t know yet'] }
    ],
    getNote: function(a) {
      var c = a.concern || '', o = a.outcome || [];
      if (c === 'Finding a company I can truly trust') return "That’s the right concern to have and it’s one we take seriously. At Singer Kitchens, trust isn’t something we try to convince you of. It’s something we’ve built over time. We’ve been here since 1928, serving generations of New Orleans families. What matters most is that we are still here long after the project is finished, if anything ever needs attention.";
      if (c === 'Making the wrong design choices') return "The fear of getting it wrong is one of the most common things we hear from homeowners and it’s exactly why our process begins with planning and listening. Our designers take the time to guide you through each decision, so you never feel rushed or uncertain along the way.";
      if (c === 'Living through the disruption') return "People tend to overestimate the temporary discomfort of living through a renovation while underestimating how much they'll love what comes after. Singer's designers do their best to set realistic expectations which will help you to prepare for the experience.";
      if (c === "Not knowing what I don't know yet") return "The most common things homeowners don't see coming: older homes often need electrical and plumbing upgrades for the appliances they want and some of those appliances need more space than expected.";
      if (o.indexOf('Proud to have people over with no more embarrassment') > -1) return "In southeast Louisiana, having people over isn't optional, it's how we live. The homeowners who come to us most often describe exactly what you just described: embarrassed by the kitchen, proud of everything else. That transformation is one we've made thousands of times. It starts with a conversation.";
      return "What you've described is exactly what Singer's planning-first process is designed to deliver. The goal is to design a kitchen you'll still love five years from now because it was planned right from the start.";
    }
  }
];

function chipClick(stepIdx, qIdx, optIdx) {
  var q = steps[stepIdx].questions[qIdx];
  var val = q.opts[optIdx];
  if (q.type === 'multi') {
    if (!answers[q.id]) answers[q.id] = [];
    var arr = answers[q.id];
    var pos = arr.indexOf(val);
    if (pos > -1) arr.splice(pos, 1);
    else arr.push(val);
  } else {
    answers[q.id] = val;
  }
  renderStep(false);
}

function goNext() {
  if (currentStep < steps.length - 1) {
    currentStep++;
    renderStep(true);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } else {
    showSummary();
  }
}

function goBack() {

    }

  var isLast = currentStep === steps.length - 1;

    }

    sHead('Your realistic timeline');
    bBlock(tl.label, tl.text);

    sHead('What New Orleans homeowners should know');
    bBlock(null, nolaCtx);

    sHead('What comes next');
    iBlock('Based on everything you shared', narrative.close);

    checkY(66);

    doc.setFont('helvetica', 'bold');
    doc.setFontSize(12);

    doc.setFont('helvetica', 'normal');
    doc.setFontSize(9.5);

    doc.text('(504) 539-4605  ·  Two showrooms: New Orleans & Mandeville', M + 14, y + 50);

    doc.save('Singer_Kitchens_Planning_Summary.pdf');
  } catch(e) {
    alert('Something went wrong generating your PDF. Please contact Singer Kitchens at (504) 539-4605.');
  }
}
